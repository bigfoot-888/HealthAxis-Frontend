    value: "http://localhost:5173/login"

  - action: fill
    selector: email
    value: testing@gmail.com

  - action: fill
    selector: password
    value: "123456789"

  - action: click
    selector: Aceptar

  - action: expectUrl
    value: "/"

  - action: expectText
    value: "Cerrar Sesión"

  - action: goto
    value: "http://localhost:5173/patients/new"

  - action: "fill"
