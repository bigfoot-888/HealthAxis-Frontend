    selector: "dni"
    value: "00075000E"
  - action: "fill"
    selector: "email"
    value: "elena@email.com"
  - action: "fill"
    selector: "phone"
    value: "600111222"
  - action: "fill"
    selector: "addressLine1"
    value: "Calle Mayor 1"
  - action: "click"
    selector: "Aceptar"

  - action: expectText
    value: "Paciente creado correctamente"

  - action: goto
    value: "http://localhost:5173/appointments/new"

  - action: "autocomplete"
